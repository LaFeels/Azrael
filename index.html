<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Azrael">
  <meta name="theme-color" content="#100c06">
  <meta name="description" content="Azrael's Chronicle — A life gamification system for the soul">

  <title>Azrael's Chronicle</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-512.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Loading screen -->
  <div id="loading">
    <div class="loading-text">Awakening...</div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast"></div>

  <!-- Main app shell -->
  <div id="app">

    <!-- World background -->
    <div class="world">
      <div class="world-g"></div>
      <div class="soul-light" style="width:300px;height:300px;background:radial-gradient(circle,rgba(90,40,160,0.6),transparent);top:-80px;left:50%;transform:translateX(-50%);animation-duration:6s"></div>
      <div class="soul-light" style="width:200px;height:200px;background:radial-gradient(circle,rgba(80,50,15,0.5),transparent);bottom:100px;right:-40px;animation-duration:8s;animation-delay:2s"></div>
      <!-- Motes generated by JS -->
    </div>

    <!-- Topbar -->
    <div class="topbar">
      <div>
        <div class="topbar-eyebrow">Chronicle of</div>
        <div class="topbar-name">Azrael</div>
      </div>
      <div class="sf-pill">
        <div class="sf-gem"></div>
        <div class="sf-val" id="sf-display">0 SF</div>
      </div>
    </div>

    <!-- Nav -->
    <nav class="nav" id="main-nav"></nav>

    <!-- Content -->
    <div class="content" id="main-content"></div>

  </div>

  <script src="app.js"></script>

  <script>
    // Generate motes
    const world = document.querySelector('.world');
    for (let i = 0; i < 8; i++) {
      const mote = document.createElement('div');
      mote.className = 'mote';
      const size = Math.random() * 2.5 + 0.5;
      mote.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;bottom:0;animation-duration:${Math.random()*20+12}s;animation-delay:${Math.random()*12}s`;
      world.appendChild(mote);
    }

    // Update SF display whenever state changes
    setInterval(() => {
      const el = document.getElementById('sf-display');
      if (el && typeof state !== 'undefined') el.textContent = state.xp + ' SF';
    }, 500);
  </script>

</body>
</html>
